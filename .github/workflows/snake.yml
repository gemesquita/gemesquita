name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: gemesquita
          outputs: |
            dist/github-snake.svg?color_snake=0b0b0b&color_dots=#ebedf0,#c9c9c9,#8f8f8f,#575757,#1f1f1f
            dist/github-snake-dark.svg?color_snake=e6edf3&color_dots=#161b22,#3a3f45,#6e7681,#a3aab3,#e6edf3
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
